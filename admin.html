<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f19">
  <title>Debryne Info Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- LOGIN SCREEN -->

  <div id="loginScreen" class="admin-login">

    <div class="login-box">

      <div class="logo">D</div>

      <h1>Debryne Info</h1>

      <p>Administrator Login</p>

      <input
        type="email"
        id="email"
        placeholder="Admin email"
        autocomplete="email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        type="button"
        id="loginButton"
        class="save-btn"
      >
        🔐 Login
      </button>

      <div id="loginStatus" class="admin-status"></div>

    </div>

  </div>


  <!-- DASHBOARD -->

  <div id="dashboard" style="display:none;">

    <header class="topbar">

      <div class="brand">

        <div class="logo">D</div>

        <div>
          <h1>Debryne Info</h1>
          <p>Administrator Dashboard</p>
        </div>

      </div>

      <button
        type="button"
        id="logoutButton"
        class="logout-btn"
      >
        Logout
      </button>

    </header>


    <main class="chat-area">

      <div class="welcome">

        <div class="bot-icon">🛠️</div>

        <h2>Verified Information</h2>

        <p>
          Add official information that
          Debryne Info can use to answer students.
        </p>

      </div>


      <div class="admin-card">

        <label for="category">
          Category
        </label>

        <select id="category">

          <option value="school">🏫 School</option>
          <option value="department">💻 Department</option>
          <option value="nacos">🎓 NACOS</option>
          <option value="sug">🏛️ SUG</option>
          <option value="sossa">🔬 SOSSA</option>
          <option value="siwes">🧑‍💻 SIWES</option>
          <option value="exams">📝 Exams</option>
          <option value="fees">💰 School Fees</option>
          <option value="general">📢 General</option>

        </select>


        <label for="question">
          Question / Topic
        </label>

        <input
          type="text"
          id="question"
          placeholder="Example: When is registration closing?"
        >


        <label for="answer">
          Verified Answer
        </label>

        <textarea
          id="answer"
          rows="8"
          placeholder="Enter the official verified information..."
        ></textarea>


        <button
          type="button"
          id="saveButton"
          class="save-btn"
        >
          💾 Save Information
        </button>


        <div id="status" class="admin-status"></div>

      </div>

    </main>


    <footer>

      <strong>DEBRYNE UPDATE</strong>

      <span>
        • Bringing You Valid News When It Matters.
      </span>

    </footer>

  </div>

</div>


<!-- FIREBASE LOGIN CODE -->

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDsUurd58zq5ltauZiDA4J3k_UR5JMI5Gs",

  authDomain:
    "debryne-info.firebaseapp.com",

  databaseURL:
    "https://debryne-info-default-rtdb.firebaseio.com/",

  projectId:
    "debryne-info",

  storageBucket:
    "debryne-info.firebasestorage.app",

  messagingSenderId:
    "505266636991",

  appId:
    "1:505266636991:web:e2a47f69524af12f6bde0a",

  measurementId:
    "G-2D9QNNQL69"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


const loginScreen =
  document.getElementById("loginScreen");

const dashboard =
  document.getElementById("dashboard");

const loginButton =
  document.getElementById("loginButton");

const logoutButton =
  document.getElementById("logoutButton");

const loginStatus =
  document.getElementById("loginStatus");


/* LOGIN */

loginButton.addEventListener(
  "click",
  async function () {

    const email =
      document.getElementById("email")
        .value.trim();

    const password =
      document.getElementById("password")
        .value;


    if (!email || !password) {

      loginStatus.textContent =
        "⚠️ Enter your email and password.";

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
      "⏳ Logging in...";


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      loginStatus.textContent =
        "✅ Login successful!";


    } catch (error) {

      console.error(error);

      loginStatus.textContent =
        "❌ " + error.message;

      loginButton.disabled = false;

      loginButton.textContent =
        "🔐 Login";

    }

  }
);


/* CHECK LOGIN */

onAuthStateChanged(
  auth,
  function(user) {

    if (user) {

      loginScreen.style.display =
        "none";

      dashboard.style.display =
        "block";

    } else {

      loginScreen.style.display =
        "flex";

      dashboard.style.display =
        "none";

    }

  }
);


/* LOGOUT */

logoutButton.addEventListener(
  "click",
  async function() {

    await signOut(auth);

  }
);

</script>

</body>
  </html>
