<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f19">
  <title>Debryne Info Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- LOGIN -->

  <div id="loginScreen" class="admin-login">

    <div class="login-box">

      <div class="logo">D</div>

      <h1>Debryne Info</h1>

      <p>Administrator Login</p>

      <input
        type="email"
        id="email"
        placeholder="Admin email"
        autocomplete="email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginButton" class="save-btn">
        🔐 Login
      </button>

      <div id="loginStatus" class="admin-status"></div>

    </div>

  </div>


  <!-- ADMIN DASHBOARD -->

  <div id="dashboard" style="display:none;">

    <header class="topbar">

      <div class="brand">

        <div class="logo">
          D
        </div>

        <div>
          <h1>Debryne Info</h1>
          <p>Administrator Dashboard</p>
        </div>

      </div>

      <button id="logoutButton" class="logout-btn">
        Logout
      </button>

    </header>


    <main class="chat-area">

      <div class="welcome">

        <div class="bot-icon">
          🛠️
        </div>

        <h2>
          Verified Information
        </h2>

        <p>
          Add official information that
          Debryne Info can use to answer students.
        </p>

      </div>


      <div class="admin-card">

        <label>
          Category
        </label>

        <select id="category">

          <option value="school">
            🏫 School
          </option>

          <option value="department">
            💻 Department
          </option>

          <option value="nacos">
            🎓 NACOS
          </option>

          <option value="sug">
            🏛️ SUG
          </option>

          <option value="sossa">
            🔬 SOSSA
          </option>

          <option value="siwes">
            🧑‍💻 SIWES
          </option>

          <option value="exams">
            📝 Exams
          </option>

          <option value="fees">
            💰 School Fees
          </option>

          <option value="general">
            📢 General
          </option>

        </select>


        <label>
          Question / Topic
        </label>

        <input
          type="text"
          id="question"
          placeholder="Example: When is registration closing?"
        >


        <label>
          Verified Answer
        </label>

        <textarea
          id="answer"
          rows="8"
          placeholder="Enter the official verified information..."
        ></textarea>


        <button
          class="save-btn"
          id="saveButton"
        >
          💾 Save Information
        </button>


        <div
          id="status"
          class="admin-status"
        ></div>

      </div>

    </main>


    <footer>

      <strong>
        DEBRYNE UPDATE
      </strong>

      <span>
        • Bringing You Valid News When It Matters.
      </span>

    </footer>

  </div>

</div>


<script
  type="module"
  src="admin.js"
></script>

</body>

  </html>
